name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
      - uses: actions/setup-node@v7
        with:
          node-version: '25'
      - run: make verify-backend test-backend
      - run: make build-web test-web lint-web

  docker:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - run: echo "${{ github.token }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - run: make ci-controller-image
      - run: make ci-machine-agent-image
      - run: make ci-daprd-image
      - if: github.ref == 'refs/heads/main'
        run: make push-images

  release:
    if: github.ref == 'refs/heads/main'
    needs: docker
    environment: main
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

  promote-images:
    if: github.ref == 'refs/heads/main' && needs.release.outputs.release_created == 'true'
    needs: release
    environment: main
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - name: Configure Docker for GCP Artifact Registry
        run: gcloud auth configure-docker europe-docker.pkg.dev
      - name: Pull from ghcr.io
        run: |
          echo "${{ github.token }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker pull ghcr.io/nbyl/metio/controller:${GITHUB_SHA::7}
          docker pull ghcr.io/nbyl/metio/machine-agent:${GITHUB_SHA::7}
          docker pull ghcr.io/nbyl/metio/daprd:${GITHUB_SHA::7}
      - name: Promote to GCP Artifact Registry
        run: make promote-distribution SHA=${GITHUB_SHA::7} VERSION=${{ needs.release.outputs.version }}
      - name: Tag ghcr.io images with version
        run: |
          docker tag ghcr.io/nbyl/metio/controller:${GITHUB_SHA::7} ghcr.io/nbyl/metio/controller:${{ needs.release.outputs.version }}
          docker tag ghcr.io/nbyl/metio/machine-agent:${GITHUB_SHA::7} ghcr.io/nbyl/metio/machine-agent:${{ needs.release.outputs.version }}
          docker tag ghcr.io/nbyl/metio/daprd:${GITHUB_SHA::7} ghcr.io/nbyl/metio/daprd:${{ needs.release.outputs.version }}
          docker push ghcr.io/nbyl/metio/controller:${{ needs.release.outputs.version }}
          docker push ghcr.io/nbyl/metio/machine-agent:${{ needs.release.outputs.version }}
          docker push ghcr.io/nbyl/metio/daprd:${{ needs.release.outputs.version }}
