name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - uses: actions/setup-node@v4
        with:
          node-version: '25'
      - run: make verify-backend test-backend
      - run: make build-web test-web lint-web

  docker:
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - run: echo "${{ github.token }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - run: make controller-image
      - run: make machine-agent-image
      - run: make push-images

  promote-images:
    if: github.ref == 'refs/heads/main'
    needs: docker
    environment: main
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - name: Configure Docker for GCP Artifact Registry
        run: gcloud auth configure-docker europe-docker.pkg.dev
      - name: Pull from ghcr.io
        run: |
          echo "${{ github.token }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker pull ghcr.io/nbyl/metio/controller:${GITHUB_SHA::7}
          docker pull ghcr.io/nbyl/metio/machine-agent:${GITHUB_SHA::7}
      - name: Tag and push to GCP Artifact Registry
        run: make promote-distribution SHA=${GITHUB_SHA::7}
