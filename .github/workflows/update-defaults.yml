name: Update image defaults on release
on:
  release:
    types: [published]

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Update image defaults and move tag
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          VERSION="${VERSION#v}"
          for f in deploy/variables.tf deploy/modules/gcp-cloud-run/variables.tf; do
            sed -i "s/:0\.0\.0/:${VERSION}/g" "$f"
          done
          git config user.name "metio-bot"
          git config user.email "bot@metio.dev"
          git add deploy/variables.tf deploy/modules/gcp-cloud-run/variables.tf
          if ! git diff --cached --quiet; then
            git commit -m "chore: update image defaults to ${VERSION}"
            git tag -f "${{ github.event.release.tag_name }}" HEAD
            git push origin "${{ github.event.release.tag_name }}" --force
          fi
