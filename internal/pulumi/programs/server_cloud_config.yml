#cloud-config
device_aliases: {minecraft_data: /dev/disk/by-id/google-minecraft-data}
fs_setup:
  - {device: minecraft_data, filesystem: ext4, label: fs1}
mounts:
  - [minecraft_data, /mnt/disks/minecraft, ext4, "defaults", "0", "2"]
users:
  - name: metio
    uid: 1000
    gecos: Metio User
    shell: /bin/bash
    primary_group: metio
    groups: docker
    system: false
write_files:
  - path: /etc/systemd/system/minecraft.service
    permissions: '0644'
    content: |
      [Unit]
      Description=Minecraft Server
      After=docker.service
      Requires=docker.service

      [Service]
      User=metio
      WorkingDirectory=/home/metio
      TimeoutStartSec=0
      Restart=always
      ExecStartPre=-/usr/bin/docker stop %n
      ExecStartPre=-/usr/bin/docker rm %n
      ExecStartPre=/bin/bash -c 'for i in 1 2 3; do docker pull itzg/minecraft-server:stable-java21 && docker run --rm --entrypoint stat itzg/minecraft-server:stable-java21 -c%%s /opt/java/openjdk/bin/java 2>/dev/null | grep -qE "^[0-9]+$" && exit 0; sleep 10; done; exit 1'
      ExecStart=/usr/bin/docker run --rm --name %n \
        -p 25565:25565 \
        -p 127.0.0.1:25575:25575 \
        -e EULA=TRUE \
        -e VERSION=${minecraftVersion} \
        -e MAX_MEMORY=3G \
        -e USE_MEOWICE_FLAGS=true \
        -e RCON_PASSWORD=${rconPassword} \
        -v /mnt/disks/minecraft/data:/data \
        itzg/minecraft-server:stable-java21
      ExecStop=/usr/bin/docker stop %n

      [Install]
      WantedBy=default.target

  - path: /etc/systemd/system/minecraft-backup.service
    permissions: '0644'
    content: |
      [Unit]
      Description=Minecraft Backup Service
      After=minecraft.service
      Requires=minecraft.service

      [Service]
      User=metio
      WorkingDirectory=/home/metio
      TimeoutStartSec=0
      Restart=always
      ExecStartPre=-/usr/bin/docker stop %n
      ExecStartPre=-/usr/bin/docker rm %n
      ExecStartPre=/bin/bash -c 'for i in 1 2 3; do docker pull ${backupImage} && exit 0; sleep 10; done; exit 1'
      ExecStart=/usr/bin/docker run --rm --name %n \
        --network host \
        -e BACKUP_METHOD=restic \
        -e BACKUP_INTERVAL="${backupInterval}" \
        -e PRUNE_RESTIC_RETENTION="${pruneResticRetention}" \
        -e RESTIC_REPOSITORY=gs:${backupBucket}:/servers/${serverId}/restic \
        -e RESTIC_PASSWORD=${resticPassword} \
        -e RCON_HOST=127.0.0.1 \
        -e RCON_PASSWORD=${rconPassword} \
        -v /mnt/disks/minecraft/data:/data \
        -v /mnt/disks/minecraft/backup-manifests:/manifests \
        ${backupImage}
      ExecStop=/usr/bin/docker stop %n

      [Install]
      WantedBy=default.target

  - path: /etc/systemd/system/metio-machine-agent.service
    permissions: '0644'
    content: |
      [Unit]
      Description=Metio Machine Agent
      After=docker.service
      Requires=docker.service

      [Service]
      User=metio
      WorkingDirectory=/home/metio
      TimeoutStartSec=0
      Restart=always
      ExecStartPre=/usr/bin/docker-credential-gcr configure-docker --registries ${imageRegistryHost}
      ExecStartPre=-/usr/bin/docker stop %n
      ExecStartPre=-/usr/bin/docker rm %n
      ExecStartPre=/bin/bash -c 'for i in 1 2 3; do docker pull ${machineAgentImage} && exit 0; sleep 10; done; exit 1'
      ExecStart=/usr/bin/docker run --rm --name %n \
        -v /var/run/docker.sock:/var/run/docker.sock \
        -v /mnt/disks/minecraft/backup-manifests:/manifests \
        -e ENVIRONMENT=${environment} \
        -e REGION=${region} \
        -e INSTANCE_NAME=${instanceName} \
        -e GCP_PROJECT=${gcpProject} \
        -e CONTROLLER_URL=${controllerUrl} \
        -e AGENT_TOKEN=${agentToken} \
        ${machineAgentImage}
      ExecStop=/usr/bin/docker stop %n

      [Install]
      WantedBy=default.target

runcmd:
  - mkdir -p /mnt/disks/minecraft/data /mnt/disks/minecraft/backup-manifests
  - chmod 0777 /mnt/disks/minecraft/backup-manifests
  - systemctl daemon-reload
  - systemctl enable minecraft ${backupServiceEnable}metio-machine-agent
  - systemctl start minecraft ${backupServiceEnable}metio-machine-agent
