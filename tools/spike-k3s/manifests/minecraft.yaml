# SPIKE ONLY - ADR-0008 issue #544.
#
# Minecraft as a Kubernetes workload, mirroring the essentials of today's
# runtime in internal/pulumi/programs/server_cloud_config.yml:33-42.
#
# Plain YAML only: no CRD, no operator, no Helm, per the milestone ground rules.
#
#   kubectl apply -f minecraft.yaml
---
apiVersion: v1
kind: Secret
metadata:
  name: minecraft-rcon
  namespace: default
type: Opaque
stringData:
  # Spike value only. Production mints this per server.
  password: spike-rcon-password
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minecraft-data
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  # No storageClassName: uses k3s's default local-path provisioner, which the
  # cloud-config points at /mnt/disks/metio/storage via
  # --default-local-storage-path. That puts the world on the attached
  # pd-standard disk rather than the boot disk.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minecraft
  namespace: default
  labels:
    app: minecraft
spec:
  replicas: 1
  # Recreate is MANDATORY, not a preference. With RollingUpdate the new pod is
  # scheduled before the old one terminates, both claim the same RWO volume,
  # and the rollout deadlocks permanently. The operator will have to get this
  # right for every workload it emits.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: minecraft
  template:
    metadata:
      labels:
        app: minecraft
    spec:
      # Give the JVM time to flush chunks on shutdown.
      terminationGracePeriodSeconds: 120
      containers:
        - name: minecraft
          image: itzg/minecraft-server:stable-java25
          imagePullPolicy: IfNotPresent
          ports:
            - { name: minecraft, containerPort: 25565, protocol: TCP }
            - { name: rcon, containerPort: 25575, protocol: TCP }
          env:
            - { name: EULA, value: "TRUE" }
            - { name: VERSION, value: "1.21.4" }
            - { name: USE_MEOWICE_FLAGS, value: "true" }
            # Deliberately the exact value ADR-0006/#533 specifies. Under
            # Kubernetes the JVM reads its ceiling from the cgroup limit, not
            # machine RAM, so this should resolve to 75% of limits.memory
            # below (~1.9Gi) rather than 75% of the 3.8Gi machine. Verifying
            # which one actually happens is a deliverable of this ticket.
            - { name: MAX_MEMORY, value: "75%" }
            - name: RCON_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minecraft-rcon
                  key: password
          resources:
            requests:
              memory: 2Gi
              cpu: 500m
            # Derived from #543's measurements: e2-medium has 3921Mi total and
            # k3s + COS consume ~734Mi idle, leaving ~3186Mi. 2560Mi keeps
            # roughly 600Mi of slack.
            limits:
              memory: 2560Mi
          volumeMounts:
            - { name: data, mountPath: /data }
          # Minecraft world generation can take minutes on first boot. The
          # startup probe absorbs that, and liveness only engages once the
          # startup probe has succeeded - otherwise a slow first start gets
          # killed in a loop.
          startupProbe:
            tcpSocket: { port: 25565 }
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            tcpSocket: { port: 25565 }
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: 25565 }
            periodSeconds: 30
            failureThreshold: 3
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: minecraft-data
---
# Public entry point. ServiceLB (klipper-lb), which #543 deliberately left
# enabled, binds this on the node and the harness firewall already allows
# tcp:25565 from 0.0.0.0/0.
#
# NOTE for cluster mode: this exposes the node IP, so it only works for one
# server per node. Multi-server hosting needs hostname-based TCP routing that
# inspects the Minecraft handshake - see ADR-0008's deferred cluster-mode
# section.
apiVersion: v1
kind: Service
metadata:
  name: minecraft
  namespace: default
spec:
  type: LoadBalancer
  selector:
    app: minecraft
  ports:
    # 25565 ONLY. RCON is deliberately absent so ServiceLB never exposes it.
    - name: minecraft
      port: 25565
      targetPort: 25565
      protocol: TCP
---
# RCON, in-cluster only. Production binds this to 127.0.0.1
# (server_cloud_config.yml:35); ClusterIP is the Kubernetes equivalent.
apiVersion: v1
kind: Service
metadata:
  name: minecraft-rcon
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: minecraft
  ports:
    - name: rcon
      port: 25575
      targetPort: 25575
      protocol: TCP
