---
stages:
  - validate
  - test
  - approval
  - build
  - promote
  - plan
  - deploy
  - cleanup

variables:
    TF_VAR_controller_image: ${CI_REGISTRY_IMAGE}/controller:${CI_COMMIT_REF_SLUG}-${CI_COMMIT_SHORT_SHA}
    TF_VAR_machine_agent_image: ${CI_REGISTRY_IMAGE}/machine-agent:${CI_COMMIT_REF_SLUG}-${CI_COMMIT_SHORT_SHA}

.frontend-test:
  stage: validate
  image: node:24-alpine
  cache:
    - key:
        files:
          - frontend/package-lock.json
      paths:
        - frontend/node_modules/
      policy: pull-push
  script:
    - cd frontend && npm ci && npm run lint && npm run test:run && npm run build
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: frontend/coverage/coverage-summary.json
    paths:
      - frontend/coverage/
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $CI_DEFAULT_BRANCH

.backend-test:
  stage: validate
  image: golang:1.25-alpine
  cache:
    - key:
        files:
          - go.sum
      paths:
        - $GOPATH/pkg/mod
      policy: pull-push
  before_script:
    - apk add --no-cache nodejs npm
  script:
    - cd frontend && npm ci && npm run build
    - cd ..
    - go mod tidy
    - go mod verify
    - go fmt ./...
    - go vet ./...
    - go test ./... -coverprofile=coverage.out -covermode=atomic
    - go tool cover -html=coverage.out -o coverage.html
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.out
    paths:
      - coverage.html
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $CI_DEFAULT_BRANCH

.approval-job:
  stage: approval
  tags:
    - saas-linux-small-amd64
  script:
    - echo "Pipeline approved for deployment"
  rules:
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
      when: manual
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: never

build-controller:
  stage: build
  tags:
    - saas-linux-small-amd64
  image: docker:24-dind
  services:
    - docker:24-dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build -f cmd/controller/Dockerfile -t $CI_REGISTRY_IMAGE/controller:${CI_COMMIT_REF_SLUG}-${CI_COMMIT_SHORT_SHA} .
    - docker push $CI_REGISTRY_IMAGE/controller:${CI_COMMIT_REF_SLUG}-${CI_COMMIT_SHORT_SHA}
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $CI_DEFAULT_BRANCH

build-machine-agent:
  stage: build
  tags:
    - saas-linux-small-amd64
  image: docker:24-dind
  services:
    - docker:24-dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build -f cmd/machine-agent/Dockerfile -t $CI_REGISTRY_IMAGE/machine-agent:${CI_COMMIT_REF_SLUG}-${CI_COMMIT_SHORT_SHA} .
    - docker push $CI_REGISTRY_IMAGE/machine-agent:${CI_COMMIT_REF_SLUG}-${CI_COMMIT_SHORT_SHA}
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $CI_DEFAULT_BRANCH

promote-images:
  stage: promote
  tags:
    - saas-linux-small-amd64
  image: docker:24-dind
  services:
    - docker:24-dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - gcloud auth configure-docker ${TF_VAR_region}-docker.pkg.dev
  script:
    - |
      for image in controller machine-agent; do
        docker pull ${CI_REGISTRY_IMAGE}/${image}:${CI_COMMIT_REF_SLUG}-${CI_COMMIT_SHORT_SHA}
        docker tag ${CI_REGISTRY_IMAGE}/${image}:${CI_COMMIT_REF_SLUG}-${CI_COMMIT_SHORT_SHA} ${TF_VAR_region}-docker.pkg.dev/${TF_VAR_project_id}/metio/${image}:${CI_COMMIT_REF_SLUG}-${CI_COMMIT_SHORT_SHA}
        docker push ${TF_VAR_region}-docker.pkg.dev/${TF_VAR_project_id}/metio/${image}:${CI_COMMIT_REF_SLUG}-${CI_COMMIT_SHORT_SHA}
      done
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $CI_DEFAULT_BRANCH

include:
   - component: $CI_SERVER_FQDN/components/opentofu/full-pipeline@3.0.1
     inputs:
      root_dir: cloud/
      auto_define_backend: true
      state_name: $CI_COMMIT_REF_SLUG
      enable_id_tokens: true
      stage_build: plan
      apply_rules:
         - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
           when: manual
         - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $CI_DEFAULT_BRANCH
      destroy_rules:
        - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
          when: never
        - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $CI_DEFAULT_BRANCH
          when: manual
      delete_state_rules:
        - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
          when: never
        - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $CI_DEFAULT_BRANCH
          when: manual
      fmt_rules:
        - if: $CI_COMMIT_BRANCH == "___DISABLED___"
      validate_rules:
        - if: $CI_COMMIT_BRANCH == "___DISABLED___"
.gitlab-tofu:id_tokens:
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: https://gitlab.com
