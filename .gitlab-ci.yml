---
stages:
  - validate
  - test
  - build
  - deploy
  - cleanup

variables:
  GITLAB_IMAGE: $CI_REGISTRY_IMAGE/controller:$CI_COMMIT_SHORT_SHA
  TF_VAR_controller_image: ${TF_VAR_region}-docker.pkg.dev/${TF_VAR_project_id}/metio/controller:$CI_COMMIT_SHORT_SHA

build-controller:
  image: docker:24.0.5
  stage: build
  services:
    - docker:24.0.5-dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build -t $GITLAB_IMAGE .
    - docker push $GITLAB_IMAGE

include:
  - component: gitlab.com/google-gitlab-components/artifact-registry/upload-artifact-registry@0.1.0
    inputs:
      stage: deploy
      source: $GITLAB_IMAGE
      target: $TF_VAR_controller_image
  - component: $CI_SERVER_FQDN/components/opentofu/validate-plan-apply@3.0.1
    inputs:
      root_dir: cloud/
      auto_define_backend: true
      state_name: $CI_COMMIT_REF_SLUG
      enable_id_tokens: true
      fmt_rules:
        - if: $CI_PIPELINE_SOURCE == "merge_request_event"
        - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH  # Don't add it to a pipeline for the default branch if it's already in a merge request pipeline.
          when: never
        - if: $CI_OPEN_MERGE_REQUESTS  # Don't add it to a *branch* pipeline if it's already in a merge request pipeline.
          when: never
        - if: $CI_COMMIT_BRANCH        # If there's no open merge request, add it to a *branch* pipeline instead.
      validate_rules:
        - if: $CI_PIPELINE_SOURCE == "merge_request_event"
        - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH  # Don't add it to a pipeline for the default branch if it's already in a merge request pipeline.
          when: never
        - if: $CI_OPEN_MERGE_REQUESTS  # Don't add it to a *branch* pipeline if it's already in a merge request pipeline.
          when: never
        - if: $CI_COMMIT_BRANCH        # If there's no open merge request, add it to a *branch* pipeline instead.
      plan_rules:
        - if: $CI_PIPELINE_SOURCE == "merge_request_event"
        - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH  # Don't add it to a pipeline for the default branch if it's already in a merge request pipeline.
          when: never
        - if: $CI_OPEN_MERGE_REQUESTS  # Don't add it to a *branch* pipeline if it's already in a merge request pipeline.
          when: never
        - if: $CI_COMMIT_BRANCH        # If there's no open merge request, add it to a *branch* pipeline instead.
      apply_rules:
        - if: $CI_PIPELINE_SOURCE == "merge_request_event"
        - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH  # Don't add it to a pipeline for the default branch if it's already in a merge request pipeline.
          when: never
        - if: $CI_OPEN_MERGE_REQUESTS  # Don't add it to a *branch* pipeline if it's already in a merge request pipeline.
          when: never
        - if: $CI_COMMIT_BRANCH        # If there's no open merge request, add it to a *branch* pipeline instead.
  - component: $CI_SERVER_FQDN/components/opentofu/validate-plan-apply@3.0.1
    inputs:
      root_dir: cloud/
      auto_define_backend: true
      state_name: production
      enable_id_tokens: true
      fmt_rules:
        - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      validate_rules:
        - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      plan_rules:
        - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      apply_rules:
        - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
.gitlab-tofu:id_tokens:
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: https://gitlab.com
