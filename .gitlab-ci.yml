---
stages:
  - validate
  - test
  - build
  - deploy
  - cleanup

variables:
  GITLAB_IMAGE: $CI_REGISTRY_IMAGE/controller:$CI_COMMIT_SHORT_SHA
  GCP_NAME: europe-west3-docker.pkg.dev/minecraftbyl/metio/controller:$CI_COMMIT_SHORT_SHA

.build-controller:
  image: docker:24.0.5
  stage: build
  services:
    - docker:24.0.5-dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build -t $GITLAB_IMAGE .
    - docker push $GITLAB_IMAGE

include:
  # - component: gitlab.com/google-gitlab-components/artifact-registry/upload-artifact-registry@0.1.0
  #   inputs:
  #     stage: deploy
  #     source: $GITLAB_IMAGE
  #     target: $GCP_NAME
  - component: $CI_SERVER_FQDN/components/opentofu/full-pipeline@3.0.1
    inputs:
      root_dir: cloud/
      auto_define_backend: true
      state_name: production
      var_file: $TF_VARIABLES
      enable_id_tokens: true

.gitlab-tofu:id_tokens:
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: https://auth.gcp.gitlab.com/oidc/nbyl
