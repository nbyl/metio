  args: ['build', '-f', 'cmd/machine-agent/Dockerfile', '-t', '$LOCATION-docker.pkg.dev/$PROJECT_ID/metio/machine-agent:$BUILD_ID', '.']
images:
- '$LOCATION-docker.pkg.dev/$PROJECT_ID/metio/machine-agent:$BUILD_ID'
options:
  logging: CLOUD_LOGGING_ONLY